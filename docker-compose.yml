services:

  api:
    build:
      context: ./apps/api

    container_name: leadflow-api

    ports:
      - "8000:8000"

    volumes:
      - ./apps/api/app:/app/app

    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${DATABASE_URL}

    env_file:
      - ./.env

    restart: unless-stopped


  n8n:
    image: docker.n8n.io/n8nio/n8n:2.30.5

    container_name: leadflow-n8n

    ports:
      - "5678:5678"

    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      WEBHOOK_URL: http://localhost:5678/
      N8N_EDITOR_BASE_URL: http://localhost:5678/

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      N8N_INTERNAL_API_TOKEN: ${N8N_INTERNAL_API_TOKEN}

      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"

      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York

      # Local HTTP development only.
      N8N_SECURE_COOKIE: "false"

      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

      # Keep the portfolio instance quiet/local.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"

    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n/workflows:/files/workflows

    depends_on:
      - api

    restart: unless-stopped


volumes:
  n8n_data: